<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Provisional Driver Licence</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="NSW Licence">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" id="appIcon">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:#000;color:#1c1c1c;overscroll-behavior:none;-webkit-font-smoothing:antialiased;
}
.app{max-width:440px;margin:0 auto;min-height:100dvh;background:#000}

/* ---------- header (black theme) ---------- */
.hdr{
  display:flex;align-items:center;background:#000;
  padding:calc(10px + env(safe-area-inset-top)) 10px 10px;position:sticky;top:0;z-index:30;
}
.hdr .ic{width:40px;height:40px;display:grid;place-items:center;border:0;background:none;padding:0}
.hdr .ic svg{width:23px;height:23px;stroke:#fff;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.hdr .dots svg{width:20px;height:20px;fill:#fff;stroke:none}
.hdr .htitle{flex:1;text-align:center;font-size:18px;font-weight:500;color:#fff;letter-spacing:-.2px}
.redbar{height:13px;background:#E8112D;position:sticky;top:calc(60px + env(safe-area-inset-top));z-index:30}

/* ---------- card ---------- */
.card{position:relative;background:#fff;margin:0 0 24px;overflow:hidden}
.pad{position:relative;z-index:3;padding:16px 20px 0}

/* watermark */
.wm{position:absolute;left:0;right:0;top:118px;height:340px;z-index:1;pointer-events:none}
.wm svg{width:100%;height:100%;display:block}
.wm .soft{
  position:absolute;inset:0;z-index:2;
  background:radial-gradient(ellipse at 50% 45%, rgba(255,255,255,0) 0%, rgba(255,255,255,.5) 60%, rgba(255,255,255,.96) 86%);
}

/* top row */
.toprow{display:flex;align-items:flex-start;position:relative;z-index:3}
.nswlogo{display:flex;flex-direction:column;align-items:center;gap:1px}
.nswlogo svg{width:42px;height:43.4px;display:block}
.nswlogo img{width:46px;height:auto;display:block}
.nswlogo .t{font-size:11.5px;font-weight:800;letter-spacing:1.8px;color:#002664;line-height:1}
.refreshed{margin-left:auto;text-align:right;font-size:12.5px;color:#6d6d6d;line-height:1.5;padding-top:2px}
.refreshed b{display:block;font-weight:400}

/* photo (wrapped in a label so tapping opens the picker natively) */
.photolabel{display:block;width:182px;margin:10px auto 0;position:relative;z-index:3;cursor:pointer;
  -webkit-touch-callout:none;-webkit-user-select:none}
.photolabel:active{opacity:.82}
.photo{width:182px;height:216px;display:block;object-fit:cover;background:#d9d9d9}

/* hidden file input */
#photoInput{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none}

/* name */
.name{text-align:center;margin-top:12px;font-size:24px;font-weight:600;color:#1c1c1c;letter-spacing:-.2px;
  position:relative;z-index:3}
.name b{font-weight:700;text-transform:uppercase}

/* fields + qr */
.mid{display:flex;gap:14px;margin-top:22px;align-items:center;position:relative;z-index:3}
.midL{flex:1;min-width:0;padding-top:2px}
.fld{margin-bottom:18px}
.fld label{display:block;font-size:13px;color:#4a4a4a;letter-spacing:.1px;margin-bottom:2px}
.fld .val{font-size:22px;font-weight:700;color:#111;letter-spacing:-.3px;line-height:1.2;white-space:nowrap}
.qrwrap{flex:0 0 auto;display:grid;place-items:center}
.qrwrap canvas{display:block;border-radius:2px}

/* dob row */
.dobrow{margin-top:2px;position:relative;z-index:3}
.dobrow label{display:block;font-size:13px;color:#4a4a4a;margin-bottom:2px}
.dobrow .val{font-size:22px;font-weight:700;color:#111;letter-spacing:-.3px}

/* class / conditions */
.boxes{display:flex;gap:10px;margin-top:20px;position:relative;z-index:3}
.box{flex:1;background:#f2f2f2;border-radius:3px;padding:11px 12px 14px}
.box .bl{display:flex;align-items:center;gap:5px;font-size:12.5px;color:#4a4a4a}
.box .info{width:15px;height:15px;border-radius:50%;border:1.3px solid #8a8a8a;
  display:grid;place-items:center;font-size:9.5px;font-weight:700;color:#8a8a8a;font-style:normal;line-height:1}
.box .bv{font-size:19px;font-weight:700;margin-top:6px;color:#111;min-height:23px;letter-spacing:.2px}

/* address */
.address{display:flex;gap:14px;padding:22px 20px 6px;position:relative;z-index:3}
.thumblabel{flex:0 0 auto;display:block;cursor:pointer;
  -webkit-touch-callout:none;-webkit-user-select:none}
.thumblabel:active{opacity:.82}
.thumb{width:66px;height:80px;display:block;object-fit:cover;background:#d9d9d9}
.address label{display:block;font-size:13px;color:#4a4a4a;margin-bottom:3px}
.address .val{font-size:20px;font-weight:700;text-transform:uppercase;color:#111;line-height:1.32;letter-spacing:-.2px}

/* signature */
.sign{padding:14px 20px 20px;text-align:center;position:relative;z-index:3}
.sign span{font-family:"Snell Roundhand","Segoe Script","Brush Script MT",cursive;
  font-size:38px;color:#1c1c1c;font-style:italic}

/* ---------- footer: red NSW band with curved top edge ---------- */
.foot{position:relative;background:#fff}
.footcurve{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.footinner{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;
  padding:62px 20px 18px}
.foot .cn .val{font-size:21px;font-weight:800;color:#fff;letter-spacing:.4px;line-height:1}
.foot .cn label{display:block;font-size:11.5px;font-weight:600;color:#fff;margin-top:5px;
  letter-spacing:.7px;text-transform:uppercase}
.foot .nswgov{display:flex;flex-direction:column;align-items:center;gap:3px}
.foot .nswgov svg{width:38px;height:39.3px;display:block}
.foot .nswgov img{width:42px;height:auto;display:block;filter:brightness(0) invert(1)}
.foot .nswgovtxt{text-align:center;line-height:1;color:#fff}
.foot .nswgovtxt b{display:block;font-size:12.5px;font-weight:800;letter-spacing:.9px}
.foot .nswgovtxt span{display:block;font-size:5.6px;font-weight:700;letter-spacing:1.15px;margin-top:2px}

/* ---------- QR zoom overlay ---------- */
.qrzoom{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.93);display:none;place-items:center;
  padding:24px;opacity:0;transition:opacity .2s ease}
.qrzoom.on{display:grid;opacity:1}
.qrzoom canvas{width:min(84vw,430px) !important;height:auto !important;border-radius:8px;
  box-shadow:0 0 0 10px #fff,0 20px 50px rgba(0,0,0,.6)}
.qrzoom .hint{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));left:0;right:0;
  text-align:center;color:#9a9a9a;font-size:13px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom));
  background:rgba(0,0,0,.85);color:#fff;font-size:13px;font-weight:500;padding:10px 18px;border-radius:999px;
  z-index:300;opacity:0;transition:opacity .3s ease;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
</style>
</head>
<body>

<div class="app">

<script>
/* ================ EDIT ME ================ */
const ID = {
  firstName : 'Yaseen',
  lastName  : 'AZIZ',
  dob       : '18 Sep 2008',
  licenceNo : '36594364',
  expiry    : '20 Feb 2027',
  licenceClass : 'C P1',
  conditions   : 'Y',
  address   : '7 Miller Ave,|Bexley North|NSW 2207',
  cardNumber: '2589786483',
  photo     : ''            // optional: 'img/me.jpg' or an https:// link. Blank = tap-to-choose
};

/* ============================================================
   IMAGE URLS  —  put your file paths / URLs between the quotes.
   Leave a slot empty ('') to fall back to the built-in artwork.
   Files live in the "img" folder next to index.html, e.g. 'img/icon.png'
   ============================================================ */
const ASSETS = {
  // Home-screen app icon — the Service NSW logo (square, 512x512 PNG, red circle)
  appIcon : 'img/unnamed.png',

  // NSW Government waratah used on the card (top-left). Transparent PNG.
  logo    : 'img/icon.png',

  // Optional separate white version for the red footer band.
  // If left empty, "logo" is used and automatically turned white.
  footerLogo : ''
};
/* ========================================= */

const $ = id => document.getElementById(id);

$('fn').textContent     = ID.firstName;
$('ln').textContent     = ID.lastName;
$('lic').textContent    = ID.licenceNo;
$('exp').textContent    = ID.expiry;
$('dob').textContent    = ID.dob;
$('cls').textContent    = ID.licenceClass;
$('cond').textContent   = ID.conditions;
$('cardno').textContent = ID.cardNumber;
$('addr').innerHTML     = ID.address.split('|').join('<br>');
$('sig').textContent    = ID.firstName[0] + ' ' + ID.lastName.charAt(0) + ID.lastName.slice(1).toLowerCase();

/* live "Refreshed" timestamp */
function stampRefreshed(){
  const now = new Date();
  const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  $('refDate').textContent = now.getDate() + ' ' + M[now.getMonth()] + ' ' + now.getFullYear();
  let hh = now.getHours(); const ap = hh < 12 ? 'am' : 'pm';
  hh = hh % 12 || 12;
  $('refTime').textContent = String(hh).padStart(2,'0') + ':' +
                             String(now.getMinutes()).padStart(2,'0') + ap;
}
stampRefreshed();

/* ============================================================
   LOGOS — swap in your uploaded images, keep the SVG on failure
   ============================================================ */
function swapLogo(hostId, url, white){
  if(!url) return;
  const host = $(hostId);
  if(!host) return;
  const img = document.createElement('img');
  img.alt = 'NSW';
  img.decoding = 'async';
  if(white) img.style.filter = 'brightness(0) invert(1)';
  img.onload = () => { host.innerHTML = ''; host.appendChild(img); };
  img.onerror = () => console.warn('logo failed to load, keeping built-in art:', url);
  img.src = url;
}

swapLogo('logoTop', ASSETS.logo, false);
swapLogo('logoFoot', ASSETS.footerLogo || ASSETS.logo, !ASSETS.footerLogo);

/* ============================================================
   PHOTO — tap the photo (or the thumbnail) to pick one.
   Saved through THREE independent routes so a reload always
   restores it: localStorage -> IndexedDB -> URL fragment.
   ============================================================ */
const PHOTO_KEY = 'nswdl.photo';
const PHOTO_W = 320, PHOTO_H = 380;   // ~1.8x the display size (182 x 216)

const PORTRAIT = "data:image/svg+xml;utf8," + encodeURIComponent(
"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 182 216'>" +
"<defs><linearGradient id='bgp' x1='0' y1='0' x2='0' y2='1'>" +
"<stop offset='0' stop-color='#e4e4e4'/><stop offset='1' stop-color='#cccccc'/></linearGradient></defs>" +
"<rect width='182' height='216' fill='url(#bgp)'/>" +
"<path d='M8 216c4-49 37-70 83-70s79 21 83 70z' fill='#31363f'/>" +
"<path d='M72 130h38v32c0 10-38 10-38 0z' fill='#d5a07e'/>" +
"<ellipse cx='91' cy='93' rx='39' ry='47' fill='#e3b28d'/>" +
"<path d='M50 90c0-31 18-46 41-46s41 15 41 46c-4-17-11-24-18-27-11 5-36 7-50 0-7 3-13 10-14 27z' fill='#241c16'/>" +
"<ellipse cx='76' cy='93' rx='3.6' ry='2.7' fill='#241c16'/>" +
"<ellipse cx='106' cy='93' rx='3.6' ry='2.7' fill='#241c16'/>" +
"<path d='M84 112q7 5 14 0' stroke='#b5795a' stroke-width='2.2' fill='none' stroke-linecap='round'/>" +
"<path d='M91 101v6' stroke='#c9906c' stroke-width='2' fill='none' stroke-linecap='round'/>" +
"<path d='M63 137q28 18 56 0' fill='#31363f'/></svg>");

function paint(src){ $('photo').src = src; $('thumb').src = src; }

/* ---------- route 1: localStorage ---------- */
function lsGet(){ try{ return localStorage.getItem(PHOTO_KEY); }catch(e){ return null; } }
function lsSet(v){
  try{
    localStorage.setItem(PHOTO_KEY, v);
    return localStorage.getItem(PHOTO_KEY) === v;   // verify it actually stuck
  }catch(e){ console.warn('localStorage unavailable', e); return false; }
}

/* ---------- route 2: IndexedDB ---------- */
function idbOpen(){
  return new Promise((res, rej) => {
    if(!window.indexedDB) return rej(new Error('no indexedDB'));
    const rq = indexedDB.open('nswdl', 1);
    rq.onupgradeneeded = () => { try{ rq.result.createObjectStore('kv'); }catch(e){} };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
    setTimeout(() => rej(new Error('indexedDB timeout')), 3000);
  });
}
async function idbSet(v){
  const db = await idbOpen();
  await new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(v, PHOTO_KEY);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
  db.close();
}
async function idbGet(){
  const db = await idbOpen();
  const v = await new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readonly');
    const rq = tx.objectStore('kv').get(PHOTO_KEY);
    rq.onsuccess = () => res(rq.result || null);
    rq.onerror = () => rej(rq.error);
  });
  db.close();
  return v;
}

/* ---------- route 3: URL fragment (survives any reload) ---------- */
function hashGet(){
  try{ return location.hash.indexOf('#p=') === 0 ? location.hash.slice(3) : null; }
  catch(e){ return null; }
}
function hashSet(uri){
  try{ history.replaceState(null, '', '#p=' + uri); return true; }
  catch(e){
    try{ location.hash = 'p=' + uri; return true; }
    catch(e2){ console.warn('could not write photo to URL', e2); return false; }
  }
}

async function loadPhoto(){
  let uri = hashGet();
  if(uri){ lsSet(uri); }                    // re-mirror the fragment into storage
  if(!uri) uri = lsGet();
  if(!uri){ try{ uri = await idbGet(); }catch(e){} }
  if(!uri) uri = ID.photo || PORTRAIT;
  paint(uri);
}

async function savePhoto(uri){
  let ok = lsSet(uri);
  if(!ok){ try{ await idbSet(uri); ok = true; }catch(e){ console.warn('indexedDB failed', e); } }
  const hashed = hashSet(uri);
  return ok || hashed;
}

/* centre-crop to the licence aspect ratio, biased slightly upward so the head fits */
function cropTo(src, w, h){
  const iw = src.width, ih = src.height;
  if(!iw || !ih) throw new Error('image has no size');
  const target = w / h;
  let sw = iw, sh = ih, sx = 0, sy = 0;
  if(iw / ih > target){
    sw = ih * target;
    sx = (iw - sw) / 2;
  }else{
    sh = iw / target;
    sy = (ih - sh) * 0.35;
  }
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, sx, sy, sw, sh, 0, 0, w, h);
  try{ return c.toDataURL('image/jpeg', 0.82); }
  catch(e){ return c.toDataURL('image/png'); }
}

const photoInput = $('photoInput');

photoInput.addEventListener('change', async () => {
  const file = photoInput.files && photoInput.files[0];
  photoInput.value = '';
  if(!file) return;

  /* preferred path: createImageBitmap also applies the EXIF rotation */
  if(window.createImageBitmap){
    try{
      const bmp = await createImageBitmap(file, { imageOrientation:'from-image' });
      const uri = cropTo(bmp, PHOTO_W, PHOTO_H);
      if(bmp.close) bmp.close();
      paint(uri);
      const ok = await savePhoto(uri);
      toast(ok ? 'Photo updated' : 'Photo set — may clear on reload', ok ? 1800 : 3200);
      return;
    }catch(e){
      console.warn('bitmap path failed, falling back', e);
    }
  }

  /* fallback: FileReader -> Image -> canvas */
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = async () => {
      let uri;
      try{ uri = cropTo(img, PHOTO_W, PHOTO_H); }
      catch(e){ console.warn(e); uri = reader.result; }
      paint(uri);
      const ok = await savePhoto(uri);
      toast(ok ? 'Photo updated' : 'Photo set — may clear on reload', ok ? 1800 : 3200);
    };
    img.onerror = () => toast('Could not read that image');
    img.src = reader.result;
  };
  reader.onerror = () => toast('Could not read that file');
  reader.readAsDataURL(file);
});

/* feedback toast — only fires on an actual event */
let toastTimer = null;
function toast(msg, ms){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), ms || 1800);
}

/* ============================================================
   SELF-CONTAINED QR ENCODER (byte mode, v1-40, RS ECC, mask opt)
   ============================================================ */
const QRGen = (function(){

  const EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  (function(){
    let x = 1;
    for(let i = 0; i < 255; i++){
      EXP[i] = x; LOG[x] = i;
      x = (x << 1) ^ ((x & 0x80) ? 0x11D : 0);
    }
    for(let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  })();
  const gfMul = (a, b) => (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]];

  function rsDivisor(deg){
    const d = new Uint8Array(deg);
    d[deg - 1] = 1;
    let root = 1;
    for(let i = 0; i < deg; i++){
      for(let j = 0; j < deg; j++){
        d[j] = gfMul(d[j], root);
        if(j + 1 < deg) d[j] ^= d[j + 1];
      }
      root = gfMul(root, 2);
    }
    return d;
  }
  function rsRemainder(data, div){
    const res = new Uint8Array(div.length);
    for(let k = 0; k < data.length; k++){
      const factor = data[k] ^ res[0];
      res.copyWithin(0, 1);
      res[res.length - 1] = 0;
      for(let i = 0; i < div.length; i++) res[i] ^= gfMul(div[i], factor);
    }
    return res;
  }

  const ECC_PER_BLOCK = [null,
    [-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],
    [-1,13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30,28,30,30,30,30,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    [-1,17,28,22,16,22,28,26,26,24,28,24,28,22,24,24,30,28,28,26,28,30,24,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30]
  ];
  const NUM_BLOCKS = [null,
    [-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
    [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49],
    [-1,1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20,23,23,25,27,29,34,34,35,38,40,43,45,48,51,53,56,59,62,65,68],
    [-1,1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25,25,34,30,32,35,37,40,42,45,48,51,54,57,60,63,66,70,74,77,81]
  ];
  const ECL_IDX    = { L:0, M:1, Q:2, H:3 };
  const ECL_FORMAT = { L:1, M:0, Q:3, H:2 };

  const rawModules = ver => {
    let r = (16 * ver + 128) * ver + 64;
    if(ver >= 2){
      const na = Math.floor(ver / 7) + 2;
      r -= (25 * na - 10) * na - 55;
      if(ver >= 7) r -= 36;
    }
    return r;
  };
  const dataCodewords = (ver, ecl) =>
    Math.floor(rawModules(ver) / 8) - ECC_PER_BLOCK[ecl + 1][ver] * NUM_BLOCKS[ecl + 1][ver];

  const N1 = 3, N2 = 3, N3 = 40, N4 = 10;

  function encode(text, eclName){
    const ecl = ECL_IDX[eclName];
    const bytes = new TextEncoder().encode(text);

    let ver = 1;
    for(; ver <= 40; ver++){
      const cc = ver <= 9 ? 8 : 16;
      if(4 + cc + bytes.length * 8 <= dataCodewords(ver, ecl) * 8) break;
    }
    if(ver > 40) throw new Error('QR payload too long');

    const bits = [];
    const push = (v, len) => { for(let i = len - 1; i >= 0; i--) bits.push((v >>> i) & 1); };
    push(0b0100, 4);
    push(bytes.length, ver <= 9 ? 8 : 16);
    for(const b of bytes) push(b, 8);

    const cap = dataCodewords(ver, ecl) * 8;
    push(0, Math.min(4, cap - bits.length));
    while(bits.length % 8) bits.push(0);
    for(let pad = 0xEC; bits.length < cap; pad ^= 0xEC ^ 0x11) push(pad, 8);

    const dataCw = new Uint8Array(bits.length / 8);
    for(let i = 0; i < bits.length; i += 8){
      let v = 0;
      for(let j = 0; j < 8; j++) v = (v << 1) | bits[i + j];
      dataCw[i / 8] = v;
    }

    const numBlocks = NUM_BLOCKS[ecl + 1][ver];
    const eccLen    = ECC_PER_BLOCK[ecl + 1][ver];
    const rawCw     = Math.floor(rawModules(ver) / 8);
    const numShort  = numBlocks - rawCw % numBlocks;
    const shortLen  = Math.floor(rawCw / numBlocks);

    const div = rsDivisor(eccLen);
    const blocks = [];
    for(let i = 0, k = 0; i < numBlocks; i++){
      const len = shortLen - eccLen + (i < numShort ? 0 : 1);
      const dat = Array.from(dataCw.slice(k, k + len));
      k += len;
      const ecc = rsRemainder(dat, div);
      if(i < numShort) dat.push(0);
      blocks.push(dat.concat(Array.from(ecc)));
    }

    const final = [];
    for(let i = 0; i < blocks[0].length; i++){
      for(let j = 0; j < blocks.length; j++){
        if(i !== shortLen - eccLen || j >= numShort) final.push(blocks[j][i]);
      }
    }

    const size = ver * 4 + 17;
    const mod = [], fn = [];
    for(let i = 0; i < size; i++){
      mod.push(new Array(size).fill(false));
      fn.push(new Array(size).fill(false));
    }
    const setF = (x, y, v) => { mod[y][x] = v; fn[y][x] = true; };

    for(let i = 0; i < size; i++){
      setF(6, i, i % 2 === 0);
      setF(i, 6, i % 2 === 0);
    }
    const finder = (cx, cy) => {
      for(let dy = -4; dy <= 4; dy++) for(let dx = -4; dx <= 4; dx++){
        const x = cx + dx, y = cy + dy;
        if(x < 0 || y < 0 || x >= size || y >= size) continue;
        const d = Math.max(Math.abs(dx), Math.abs(dy));
        setF(x, y, d !== 2 && d !== 4);
      }
    };
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);

    const align = (() => {
      if(ver === 1) return [];
      const n = Math.floor(ver / 7) + 2;
      const step = ver === 32 ? 26 : Math.ceil((ver * 4 + 4) / (n * 2 - 2)) * 2;
      const res = [6];
      for(let pos = ver * 4 + 10; res.length < n; pos -= step) res.splice(1, 0, pos);
      return res;
    })();
    for(let i = 0; i < align.length; i++){
      for(let j = 0; j < align.length; j++){
        if((i === 0 && j === 0) ||
           (i === 0 && j === align.length - 1) ||
           (i === align.length - 1 && j === 0)) continue;
        const cx = align[i], cy = align[j];
        for(let dy = -2; dy <= 2; dy++) for(let dx = -2; dx <= 2; dx++)
          setF(cx + dx, cy + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
      }
    }

    function drawFormat(mask){
      const data = (ECL_FORMAT[eclName] << 3) | mask;
      let rem = data;
      for(let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const b = ((data << 10) | rem) ^ 0x5412;
      const bit = i => (b >>> i) & 1;
      for(let i = 0; i <= 5; i++) setF(8, i, bit(i));
      setF(8, 7, bit(6));
      setF(8, 8, bit(7));
      setF(7, 8, bit(8));
      for(let i = 9; i < 15; i++) setF(14 - i, 8, bit(i));
      for(let i = 0; i < 8; i++) setF(size - 1 - i, 8, bit(i));
      for(let i = 8; i < 15; i++) setF(8, size - 15 + i, bit(i));
      setF(8, size - 8, true);
    }
    drawFormat(0);

    if(ver >= 7){
      let rem = ver;
      for(let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
      const b = (ver << 12) | rem;
      for(let i = 0; i < 18; i++){
        const c = (b >>> i) & 1;
        const a = size - 11 + i % 3, bb = Math.floor(i / 3);
        setF(a, bb, c);
        setF(bb, a, c);
      }
    }

    let bi = 0;
    for(let right = size - 1; right >= 1; right -= 2){
      if(right === 6) right = 5;
      for(let vert = 0; vert < size; vert++){
        for(let j = 0; j < 2; j++){
          const x = right - j;
          const upward = ((right + 1) & 2) === 0;
          const y = upward ? size - 1 - vert : vert;
          if(!fn[y][x] && bi < final.length * 8){
            mod[y][x] = ((final[bi >> 3] >>> (7 - (bi & 7))) & 1) !== 0;
            bi++;
          }
        }
      }
    }

    const applyMask = m => {
      for(let y = 0; y < size; y++) for(let x = 0; x < size; x++){
        if(fn[y][x]) continue;
        let inv;
        switch(m){
          case 0: inv = (x + y) % 2 === 0; break;
          case 1: inv = y % 2 === 0; break;
          case 2: inv = x % 3 === 0; break;
          case 3: inv = (x + y) % 3 === 0; break;
          case 4: inv = (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0; break;
          case 5: inv = (x * y) % 2 + (x * y) % 3 === 0; break;
          case 6: inv = ((x * y) % 2 + (x * y) % 3) % 2 === 0; break;
          default: inv = ((x + y) % 2 + (x * y) % 3) % 2 === 0; break;
        }
        if(inv) mod[y][x] = !mod[y][x];
      }
    };

    const addHist = (len, h) => { if(h[0] === 0) len += size; h.pop(); h.unshift(len); };
    const countPat = h => {
      const n = h[1];
      const core = n > 0 && h[2] === n && h[3] === n * 3 && h[4] === n && h[5] === n;
      return (core && h[0] >= n * 4 && h[6] >= n ? 1 : 0) +
             (core && h[6] >= n * 4 && h[0] >= n ? 1 : 0);
    };
    const endRun = (color, len, h) => {
      if(color){ addHist(len, h); len = 0; }
      len += size;
      addHist(len, h);
      return countPat(h);
    };

    function penalty(){
      let res = 0;
      for(let y = 0; y < size; y++){
        let color = false, run = 0; const h = [0,0,0,0,0,0,0];
        for(let x = 0; x < size; x++){
          if(mod[y][x] === color){
            run++;
            if(run === 5) res += N1; else if(run > 5) res++;
          }else{
            addHist(run, h);
            if(!color) res += countPat(h) * N3;
            color = mod[y][x]; run = 1;
          }
        }
        res += endRun(color, run, h) * N3;
      }
      for(let x = 0; x < size; x++){
        let color = false, run = 0; const h = [0,0,0,0,0,0,0];
        for(let y = 0; y < size; y++){
          if(mod[y][x] === color){
            run++;
            if(run === 5) res += N1; else if(run > 5) res++;
          }else{
            addHist(run, h);
            if(!color) res += countPat(h) * N3;
            color = mod[y][x]; run = 1;
          }
        }
        res += endRun(color, run, h) * N3;
      }
      for(let y = 0; y < size - 1; y++) for(let x = 0; x < size - 1; x++){
        const c = mod[y][x];
        if(c === mod[y][x + 1] && c === mod[y + 1][x] && c === mod[y + 1][x + 1]) res += N2;
      }
      let dark = 0;
      for(let y = 0; y < size; y++) for(let x = 0; x < size; x++) if(mod[y][x]) dark++;
      const total = size * size;
      res += (Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1) * N4;
      return res;
    }

    let best = 0, bestScore = Infinity;
    for(let m = 0; m < 8; m++){
      applyMask(m); drawFormat(m);
      const s = penalty();
      if(s < bestScore){ bestScore = s; best = m; }
      applyMask(m);
    }
    applyMask(best);
    drawFormat(best);

    return { size, modules: mod };
  }

  return { encode };
})();

/* ============================================================
   QR PAYLOAD — modelled on the real NSW Digital Driver Licence
   token: [1|0] . [signed JWT, header stripped] . [b64(type.no.ts)]
   ============================================================ */
const b64urlBytes = bytes => {
  let s = '';
  for(let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
};
const b64urlText = str => b64urlBytes(new TextEncoder().encode(str));
const randB64 = n => b64urlBytes(crypto.getRandomValues(new Uint8Array(n)));

function uuid4(){
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  const h = Array.from(b, x => x.toString(16).padStart(2,'0')).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}

function buildPayload(){
  const ts = Math.floor(Date.now() / 1000);
  const core = '0.' + ID.licenceNo + '.' + ts;

  if(QR_OPTS.mode === 'data'){
    return ['NSW DRIVER LICENCE',
            'LN ' + ID.licenceNo,
            ID.firstName + ' ' + ID.lastName,
            'DOB ' + ID.dob,
            'EXP ' + ID.expiry,
            'CLASS ' + ID.licenceClass,
            'COND ' + ID.conditions,
            'CARD ' + ID.cardNumber].join('\n');
  }

  const jwtPayload = { t:1, v:1, iat:ts, jti:uuid4(), lic:ID.licenceNo };
  if(QR_OPTS.mode === 'full') jwtPayload.sig = randB64(256);

  const sigLen = QR_OPTS.mode === 'link' ? 64 : 256;
  const jwt = b64urlText(JSON.stringify(jwtPayload)) + '.' + randB64(sigLen);

  if(QR_OPTS.mode === 'link'){
    return 'https://www.service.nsw.gov.au/check-a-licence?d=' +
           b64urlText('1.' + jwt + '.' + core);
  }
  return '1.' + jwt + '.' + b64urlText(core);
}

/* ---- QR payload settings ---- */
const QR_OPTS = {
  mode : 'full',    // 'full' | 'compact' | 'link' | 'data'
  ecc  : 'M',       // L / M / Q / H
  quiet: 4,
  maxPx: 205
};

/* ============================================================
   RENDER
   ============================================================ */
function drawQR(){
  let qr;
  try{
    qr = QRGen.encode(buildPayload(), QR_OPTS.ecc);
  }catch(err){
    console.warn('QR encode failed', err);
    return;
  }

  const quiet = QR_OPTS.quiet;
  const total = qr.size + quiet * 2;
  const cssSize = Math.max(120, Math.min(QR_OPTS.maxPx, Math.round(window.innerWidth * 0.52)));
  const scale = 8;

  const c = document.createElement('canvas');
  c.width = c.height = total * scale;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#111111';
  for(let y = 0; y < qr.size; y++){
    for(let x = 0; x < qr.size; x++){
      if(qr.modules[y][x]){
        ctx.fillRect((x + quiet) * scale, (y + quiet) * scale, scale, scale);
      }
    }
  }
  c.style.width = c.style.height = cssSize + 'px';
  c.style.display = 'block';

  const box = $('qr');
  box.innerHTML = '';
  box.appendChild(c);
}

drawQR();

  [ 69, "M0 0 C -36 -42, -39 -87, -16 -129 C -9 -140, 9 -140, 16 -129 C 39 -87, 36 -42, 0 0 Z"],

];
const WARATAH_BAND = "M46 262 C 100 286, 200 286, 254 262 C 264 268, 254 280, 236 285 C 188 296, 112 296, 64 285 C 46 280, 36 268, 46 262 Z";

/* built-in fallback app icon: red circle + white waratah (Service NSW style) */
function makeIcon(){
  const S = 180;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const x = c.getContext('2d');

  x.fillStyle = '#E8112D';
  x.beginPath();
  x.arc(S/2, S/2, S/2, 0, Math.PI * 2);
  x.fill();

  const s = 0.56;
  x.save();
  x.translate(S/2 - 150*s, S/2 - 155*s);
  x.scale(s, s);
  x.lineJoin = 'round'; x.lineCap = 'round';
  x.fillStyle = '#ffffff';
  x.strokeStyle = '#E8112D';
  x.lineWidth = 9;

  const base = new DOMMatrix().translate(150, 250);
  WARATAH_PETALS.forEach(([deg, d]) => {
    const p = new Path2D();
    p.addPath(new Path2D(d), base.rotate(deg));
    x.fill(p); x.stroke(p);
  });
  const band = new Path2D(WARATAH_BAND);
  x.fill(band); x.stroke(band);
  x.restore();

  return c.toDataURL('image/png');
}
